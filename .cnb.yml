# 推送 main 自动部署到腾讯云 EdgeOne Pages（纯静态站点，无构建步骤）
#
# 前置一次性配置：
#   1. 注册 EdgeOne Pages（https://console.cloud.tencent.com/edgeone/pages），
#      在「项目设置 → API Token」创建 Token；
#   2. 在 CNB 新建一个「密钥仓库」（如 OASIS-Art3mis/env），
#      其中新建文件 edgeone.yml，内容一行：
#        EO_SECRET: "你的 EdgeOne Pages Token"
#   3. 确认下方 imports 的 URL 与你的密钥仓库路径一致。
# 部署完成后到 EdgeOne Pages 控制台获取默认域名（形如 xxx.edgeone.app）。
main:
  push:
    - stages:
        # 组装站点根目录：入口页改名 index.html，只带运行必需的文件
        - name: 组装静态站点
          image: alpine:3.20
          script: |
            mkdir -p dist
            cp cs16.html dist/index.html
            cp game.js three.min.js dist/
            ls -la dist
        # 部署（项目名 webcs，重复推送自动更新同一项目）
        - name: 部署到 EdgeOne Pages
          imports:
            - https://cnb.cool/OASIS-Art3mis/env/-/blob/main/edgeone.yml
          image: tencentcom/deploy-eopages:latest
          script: edgeone pages deploy ./dist -n webcs -t "$EO_SECRET"
